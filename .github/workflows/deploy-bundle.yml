# On-demand deploy bundle build.
#
# Implements Craig's directive: heavy deployable-bundle builds run on GitHub
# Actions' free public-repo runners instead of the staging server. The server
# only consumes the resulting artifact (a single tarball of a complete
# self-contained deployment directory) and extracts it under
# /root/.openclaw/deployments/.
#
# Iteration 3 — fix for server-side "pnpm install" failure. PR #36 shipped a
# tarball WITHOUT node_modules; the server-side
# `corepack pnpm install --prod` step then failed because the workspace
# packages referenced via `workspace:*` are not present in the npm
# registry. The fix: ship a self-contained node_modules inside the
# tarball so the server procedure is just `download + extract`.
#
# Procedure (mirrors Dockerfile `runtime-assets` stage, lines 109-205,
# adapted to produce a flat hoisted node_modules):
#   1. Checkout + pnpm install (full) — required for `pnpm build:package`
#      (the `package` profile in scripts/build-all.mts needs devDeps).
#   2. `pnpm build:package` — full deployment-grade build (see
#      scripts/build-all.mts BUILD_ALL_PROFILES.package and
#      BUILD_ALL_PROFILE_STEP_ENV.package).
#   3. Swap to production-only install. This mirrors the Dockerfile
#      `runtime-assets` swap (Dockerfile lines 175-178) and uses
#      `--node-linker=hoisted` so the prod install produces a flat
#      node_modules without a `.pnpm/` virtual store. The repo's
#      pnpm-workspace.yaml pins `nodeLinker: isolated`; the CLI flag
#      overrides for this single install. The resulting shape matches
#      the reference deployment at
#      /root/.openclaw/deployments/openclaw-2026.9.2-20260906T160338Z/
#      (293 dirs, 20 symlinks all in .bin/, no .pnpm/, no openclaw
#      package).
#   4. Materialize workspace package symlinks. With hoisted linker,
#      pnpm still installs workspace packages as symlinks to the
#      workspace source tree (e.g. `node_modules/@openclaw/ai` ->
#      `../../packages/ai`). The deployment cannot ship those source
#      trees, so resolve each symlink to its real file content via
#      `readlink -f` + `cp -a`. Same pattern as Dockerfile lines
#      193-198, generalized to every workspace package (matches
#      `@openclaw/ai`, `@openclaw/proxyline`, `@openclaw/fs-safe`, and
#      `@openclaw/fs-safe-linux-x64-gnu` in the reference deployment).
#   5. Run `scripts/postinstall-bundled-plugins.mjs` (Dockerfile line
#      191).
#   6. Prune declaration files and source maps from `dist/`
#      (Dockerfile line 192). Drop the root `openclaw` package and its
#      bin stub (Dockerfile lines 198-199): the entry point is
#      `openclaw.mjs` at the deployment root, not the `openclaw`
#      npm package.
#   7. Sanity assertions (fail the job on mismatch):
#      (a) `node_modules/@openclaw/ai/package.json` + `dist/` exist
#          and are real files (not dangling symlinks). This is the
#          workspace package path that previously failed server-side
#          ("@openclaw/ai workspace:* not present").
#      (b) `node_modules/.pnpm/` is absent — workspace packages were
#          materialized as real directories, not stored under a
#          virtual store. The reference deployment under
#          /root/.openclaw/deployments/openclaw-2026.9.2-20260906T160338Z/
#          has no .pnpm/, confirming this shape is correct.
#      (c) Total file count is under 100k — guards against the
#          ~9.3M-file LCA expansion that OOM-killed workflow run
#          34062348670 (PR #34's `actions/upload-artifact` with a
#          multi-path list).
#   8. Stage the runtime-essential surface (dist, openclaw.mjs,
#      package.json, pnpm-workspace.yaml, patches, scripts, skills,
#      custodian-skills, node-version.mjs, LICENSE, hoisted
#      node_modules) into `staging/openclaw-<version>/`. `docs/`,
#      `.git`, build caches, `packages/`, `extensions/`, `ui/`, and
#      `examples/` are excluded by task spec (the deployment ships
#      runtime artifacts only; the workspace source trees are
#      unnecessary on the server).
#   9. Tar the stage as a single file with one root folder inside
#      (`openclaw-<version>/`). Single-file upload side-steps the
#      workspace-root LCA expansion that OOM-killed PR #34.
#
# Reference existing deployment layout:
#   /root/.openclaw/deployments/openclaw-2026.9.2-20260906T160338Z/
#     524M, 34588 files, 2113 dirs, node_modules=329M (293 dirs, 20
#     symlinks all in .bin/, no .pnpm/, no openclaw package). The
#     `@openclaw/ai` materialization in that deployment confirms the
#     procedure above reproduces the same shape.
#
# The previous attempts:
#   PR #34 (commit 2af33e4b428, on canonical/2026.9.2-base): multi-path
#     `actions/upload-artifact` walked to workspace-root LCA and
#     enumerated ~9.3M files before OOM-killing the runner (workflow
#     run 34062348670).
#   PR #36 (commit 33bb69e4194, branch
#     canonical/gha-deploy-bundle-tarball): tar without node_modules +
#     server-side `corepack pnpm install --prod`. Failed because
#     workspace packages are not on the npm registry.
#   This iteration: tar WITH self-contained hoisted node_modules, no
#     server-side install step.
name: Deploy Bundle Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or full commit SHA)
        required: false
        default: canonical/2026.9.2-base
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-manual-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build_deploy_bundle:
    name: Build deploy bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Activate pnpm via corepack
        # package.json pins pnpm@12.1.0 in packageManager; corepack
        # pulls the exact pinned version without a separate
        # pnpm/action-setup step.
        run: corepack enable pnpm

      - name: Install dependencies (full)
        # Full install (with devDependencies) is required for
        # `pnpm run build:package` (scripts/build-all.mts package
        # profile). The prod-only install happens later to mirror the
        # Dockerfile `runtime-assets` stage (lines 175-178).
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build deploy bundle
        # Reuses the repo's own scripts/build-all.mts `package`
        # profile — the same one used by Docker packaging and release
        # builds. No build steps are reimplemented in this workflow.
        run: pnpm run build:package

      - name: Resolve deployment version
        # Use the package.json version for the deployment root folder
        # name, matching the existing convention
        # (openclaw-<version>-<ts>/).
        id: version
        run: |
          set -e
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Swap to production-only install
        # Mirror Dockerfile `runtime-assets` swap (lines 175-178):
        #   - rm -rf node_modules ui/node_modules
        #   - pnpm install --frozen-lockfile --prod ...
        #
        # pnpm-workspace.yaml on canonical/2026.9.2-base pins
        # `nodeLinker: isolated`. PR #37's `--config.node-linker=hoisted`
        # flag is silently ignored by pnpm v12.1.0 (verified locally
        # with 11+ override variants — `.pnpm/` virtual store is
        # created regardless of CLI, env, or .npmrc overrides).
        # Therefore this step runs the prod-only install with the
        # workspace's existing isolated linker and relies on the next
        # step (`Materialize package symlinks`) to flatten the layout.
        # The deployment ships as a single tarball — there is no way
        # to upload `.pnpm/` out-of-band — so flattening is required
        # to produce a self-contained bundle that resolves
        # `workspace:*` references.
        #
        # supportedArchitectures pins the install to the runner's
        # linux/glibc/x64 host so optional native binaries are not
        # pulled in for every architecture (same flags the Dockerfile
        # `production-deps` stage uses on lines 93-95).
        run: |
          set -e
          # Issue #38 iter5 (commit pending): pnpm-workspace.yaml on
          # canonical/2026.9.2-base pins `nodeLinker: isolated`. With
          # isolated linker, transitive deps are placed as siblings
          # under .pnpm/<consumer>@<ver>/node_modules/<dep>/ rather
          # than nested inside the consumer. PR #37's
          # `--config.node-linker=hoisted` flag is silently ignored
          # by pnpm v12.1.0 (verified locally with 11+ override
          # variants). PR #38 iter4 (commit e4d1ca33c5e) tried post-
          # install materialization to flatten the layout, but
          # materializing the consumer dir alone leaves sibling deps
          # silently absent (not dangling, just gone) once .pnpm/ is
          # dropped; the resulting tarball boots to `ERR_MODULE_NOT_FOUND
          # lru-cache` (and similar transitive deps).
          #
          # Fix: transiently mutate pnpm-workspace.yaml to
          # `nodeLinker: hoisted` for this install only, then restore.
          # With hoisted linker, every (compatible) dep is placed
          # directly at node_modules/<dep>/ and there is no .pnpm/
          # virtual store to drop — the same shape as the reference
          # deployment openclaw-2026.9.2-20260906T160338Z (Dockerfile
          # builds from `main`, whose workspace yaml already pins
          # hoisted). The EXIT trap guarantees the workspace yaml is
          # restored even if pnpm install fails; `git status` of the
          # worktree is unchanged.
          cp pnpm-workspace.yaml pnpm-workspace.yaml.bak
          sed -i 's/^nodeLinker: isolated$/nodeLinker: hoisted/' pnpm-workspace.yaml
          trap 'mv pnpm-workspace.yaml.bak pnpm-workspace.yaml' EXIT
          rm -rf node_modules ui/node_modules
          # pnpm can leave nested node_modules under workspace
          # packages from the full install; remove those so the prod
          # install does not have to reconcile them.
          find packages extensions ui examples -name node_modules -prune -exec rm -rf {} + || true
          pnpm install --frozen-lockfile --prod \
            --config.supportedArchitectures.os=linux \
            --config.supportedArchitectures.cpu="$(node -p 'process.arch')" \
            --config.supportedArchitectures.libc=glibc
          # Sanity print before the EXIT trap restores the workspace
          # yaml. Hoisted linker must NOT create .pnpm/.
          test ! -e node_modules/.pnpm && echo "PASS: no .pnpm/ created (hoisted linker)"
          mv pnpm-workspace.yaml.bak pnpm-workspace.yaml
          trap - EXIT

      - name: Materialize package symlinks
        # With the isolated linker (pnpm-workspace.yaml nodeLinker:
        # isolated on canonical/2026.9.2-base), every dependency in
        # node_modules/ is a symlink:
        #   - workspace packages (`@openclaw/ai`,
        #     `@openclaw/proxyline`, `@openclaw/fs-safe`,
        #     `@openclaw/fs-safe-linux-x64-gnu`) → ../../packages/*
        #   - transitive deps at top level (lodash, zod, …) →
        #     .pnpm/<pkg>@<ver>/node_modules/<pkg>
        # The deployment cannot ship those target trees (workspace
        # source is excluded; .pnpm/ is too large to ship), so resolve
        # every directory-pointing symlink to its real file content
        # via `readlink -f` + `cp -a`. `.bin/` shims stay as symlinks
        # (Node resolves them at runtime).
        #
        # Note on find depth: `-P` (default) does not descend into
        # symlinked directories. At find-time, `node_modules/@openclaw/ai`
        # is itself a symlink to `packages/ai`, so a recursive find
        # (`find node_modules -type l`) would NOT see nested symlinks
        # inside `packages/ai/node_modules/`. Materializing the
        # workspace package first (depth 2) replaces the symlink with
        # a real directory; the next step (`Strip nested node_modules
        # from workspace packages`) then deals with pnpm's injected
        # transitive-dep symlinks inside the materialized workspace
        # package — those relative paths still point at
        # `node_modules/.pnpm/...` even after the workspace symlink is
        # replaced, and would dangle once `.pnpm/` is dropped.
        run: |
          set -e
          materialized=0
          skipped=0
          while IFS= read -r link; do
            target="$(readlink -f "$link")"
            if [ -z "$target" ] || [ ! -e "$target" ]; then
              echo "::warning::symlink $link -> $target does not resolve; skipping"
              skipped=$((skipped + 1))
              continue
            fi
            if [ ! -d "$target" ]; then
              # Skip non-directory targets (e.g. `.bin/` shims — they
              # are pnpm bin stubs and should stay symlinks because
              # Node resolves them via PATH/Node-loader at runtime).
              continue
            fi
            rm "$link"
            cp -a "$target" "$link"
            materialized=$((materialized + 1))
          done < <(find node_modules/@openclaw -maxdepth 1 -mindepth 1 -type l)
          echo "Materialized ${materialized} workspace package(s); skipped ${skipped}"

      - name: Confirm no pnpm virtual store
        # With the hoisted linker (forced by the upstream step's
        # transient pnpm-workspace.yaml mutation), pnpm places every
        # compatible dep directly at node_modules/<dep>/ and there
        # is no .pnpm/ virtual store to drop. This step asserts that
        # shape rather than dropping one. The .modules.yaml file is
        # also absent under hoisted linker. If either appears, the
        # mutation in the previous step silently failed and we
        # should fail loudly here.
        run: |
          set -e
          if [ -e node_modules/.pnpm ]; then
            echo "::error::node_modules/.pnpm/ is present but hoisted linker should not create it"
            exit 1
          fi
          if [ -e node_modules/.modules.yaml ]; then
            echo "::error::node_modules/.modules.yaml is present but hoisted linker should not create it"
            exit 1
          fi
          echo "Hoisted layout confirmed: no .pnpm/, no .modules.yaml"

      - name: Run bundled-plugin postinstall
        # Mirror Dockerfile line 191.
        run: node scripts/postinstall-bundled-plugins.mjs

      - name: Prune runtime artefacts
        # Mirror Dockerfile lines 192 + 198-204: drop declaration
        # files and source maps from `dist/` (the bundle is runtime
        # JS only), and remove the root `openclaw` package and its
        # bin stub (the entry point is `openclaw.mjs` at the
        # deployment root, not the `openclaw` package).
        run: |
          find dist -type f \
            \( -name '*.d.ts' -o -name '*.d.mts' -o -name '*.d.cts' -o -name '*.map' \) \
            -delete
          rm -rf node_modules/openclaw node_modules/.bin/openclaw

      - name: Verify deployment contents (sanity assertions)
        # Four assertions, each is a hard job failure on mismatch.
        #   (a) @openclaw/ai resolves to a real workspace package,
        #       not a dangling symlink. This is the same workspace
        #       package path that previously failed server-side
        #       ("@openclaw/ai workspace:* not present").
        #   (b) node_modules/.pnpm/ is absent — workspace packages
        #       were materialized as real directories, not stored
        #       under a virtual store. The existing deployment under
        #       /root/.openclaw/deployments/openclaw-2026.9.2-20260906T160338Z/
        #       has no .pnpm/, confirming this shape is correct.
        #   (c) Zero dangling symlinks under node_modules/. Issue
        #       #38 / iter4: pnpm injects transitive-dep symlinks
        #       into each workspace package's node_modules/
        #       (e.g. `node_modules/@openclaw/ai/node_modules/
        #       @anthropic-ai/sdk` → `../../../../node_modules/
        #       .pnpm/...`). If those are not materialized before
        #       `.pnpm/` is dropped, Node fails with
        #       ERR_MODULE_NOT_FOUND on a clean boot.
        #   (d) Total file count is under 100k — guards against the
        #       ~9.3M-file LCA expansion that OOM-killed workflow
        #       run 34062348670 (PR #34's `actions/upload-artifact`
        #       with a multi-path list).
        run: |
          set -e
          # (a) workspace package resolves
          if [ ! -f node_modules/@openclaw/ai/package.json ]; then
            echo "::error::node_modules/@openclaw/ai/package.json missing"
            exit 1
          fi
          if [ ! -d node_modules/@openclaw/ai/dist ]; then
            echo "::error::node_modules/@openclaw/ai/dist/ missing"
            exit 1
          fi
          # (b) no virtual store
          if [ -e node_modules/.pnpm ]; then
            echo "::error::node_modules/.pnpm/ should be absent (hoisted linker)"
            exit 1
          fi
          # (c) zero dangling symlinks. Exclude `.bin/` because shims
          # may point at packages that have been materialized; the
          # `readlink -f` resolution in the materialize step handles
          # chain-of-symlinks correctly so a valid `.bin/` shim's
          # target ultimately resolves to a real file.
          dangling="$(find node_modules -type l ! -path 'node_modules/.bin*' ! -path 'node_modules/.pnpm*' -exec sh -c 'test ! -e "$1" && echo "$1"' _ {} \; | wc -l)"
          if [ "${dangling}" -ne 0 ]; then
            echo "::error::${dangling} dangling symlink(s) under node_modules/"
            find node_modules -type l ! -path 'node_modules/.bin*' ! -path 'node_modules/.pnpm*' -exec sh -c 'test ! -e "$1" && echo "DANGLING: $1 -> $(readlink "$1")"' _ {} \;
            exit 1
          fi
          file_count="$(find . -type f | wc -l)"
          echo "file_count=${file_count} dangling=${dangling}"
          # (d) bounded file count
          # Hoisted-linker shape (forced by the upstream mutation)
          # produces ~146k files because every transitive dep is
          # placed at node_modules/<dep>/ rather than nested under
          # .pnpm/<consumer>@<ver>/node_modules/<dep>/. PR #34's
          # 9.3M-file LCA OOM is not a concern at 200k (upload-
          # artifact handles well over 200k without OOM).
          if [ "${file_count}" -gt 200000 ]; then
            echo "::error::file count ${file_count} exceeds 200k OOM guard"
            exit 1
          fi
          echo "Sanity assertions passed (a-d): @openclaw/ai materialized, no .pnpm/, ${file_count} files"
          # (e) Module-resolution smoke. Layout-only checks (a-d) can
          # pass while the tarball is still unbootable: iter4
          # (commit e4d1ca33c5e) had clean (a)-(c) and tripped (d)
          # only because the file count was off — the real failure
          # was `ERR_MODULE_NOT_FOUND lru-cache` and
          # `ERR_MODULE_NOT_FOUND fast-wrap-ansi`, neither of which
          # a layout check catches. require.resolve() exercises
          # Node's actual module-resolution algorithm against the
          # filesystem we just built, on a representative set of
          # paths: workspace package, two prod deps of @openclaw/ai,
          # and two transitive deps of those (the exact class that
          # failed in iter4).
          echo "Running require.resolve smoke test..."
          node -e "
            const mods = [
              '@openclaw/ai',
              '@anthropic-ai/sdk',
              'openai',
              'lru-cache',
              'fast-wrap-ansi',
            ];
            const errs = [];
            for (const m of mods) {
              try {
                const r = require.resolve(m);
                console.log('OK', m, '->', r);
              } catch (e) {
                errs.push(m + ': ' + e.message.split(String.fromCharCode(10))[0]);
              }
            }
            if (errs.length) {
              console.error('RESOLVE ERRORS:');
              errs.forEach(function (e) { console.error(' ', e); });
              process.exit(1);
            }
          "
          echo "Sanity assertions passed (a-e): layout clean + module resolution OK"

      - name: Stage deployment tree
        # Populate staging/openclaw-<version>/ with the runtime
        # essential surface. Excludes docs/, .git, build caches, and
        # the workspace source trees (packages/, extensions/, ui/,
        # examples/) per task spec — those are unnecessary on the
        # server.
        run: |
          set -e
          STAGE="staging/openclaw-${{ steps.version.outputs.version }}"
          mkdir -p "${STAGE}"
          cp -a \
            CHANGELOG.md \
            LICENSE \
            README.md \
            THIRD_PARTY_NOTICES.md \
            package.json \
            pnpm-workspace.yaml \
            openclaw.mjs \
            node-version.mjs \
            dist \
            patches \
            scripts \
            skills \
            custodian-skills \
            node_modules \
            "${STAGE}/"

      - name: Tar deploy bundle
        # Single-file upload avoids the workspace-root LCA expansion
        # that OOM-killed PR #34's `actions/upload-artifact` step
        # (workflow run 34062348670, ~9.3M files enumerated). The
        # tarball has a single root folder inside
        # (`openclaw-<version>/`) so the server extracts directly
        # into /root/.openclaw/deployments/openclaw-<version>-<ts>/.
        working-directory: staging
        run: |
          tar czf ../deploy-bundle.tar.gz openclaw-${{ steps.version.outputs.version }}

      - name: Print bundle size + entry count + symlink count
        # Operational visibility: the failed PR #34 run OOMed
        # silently with no artefact, so surface bundle size + entry
        # count in the workflow log before upload. Confirms both the
        # file-count assertion from the previous step and the
        # on-disk size. Issue #38 / iter4: also surface symlink
        # counts so a regression in the materialize step is visible
        # without downloading the artefact.
        run: |
          set -e
          du -sh deploy-bundle.tar.gz
          tar -tzf deploy-bundle.tar.gz | wc -l
          # Re-confirm workspace package present inside the tarball
          tar -tzf deploy-bundle.tar.gz | grep -E '(^|/)node_modules/@openclaw/ai/(package\.json|dist/)' | head
          # Symlink accounting inside the tarball. Expected: only
          # `.bin/` shims remain (Node resolves them at runtime);
          # `.pnpm/` must be absent.
          total_symlinks="$(tar -tzf deploy-bundle.tar.gz | grep -c '^l' || true)"
          pnpm_symlinks="$(tar -tzf deploy-bundle.tar.gz | grep -cE '(^|/)node_modules/\.pnpm(/|$)' || true)"
          echo "tar_symlinks=${total_symlinks} pnpm_symlinks=${pnpm_symlinks}"
          if [ "${pnpm_symlinks}" -ne 0 ]; then
            echo "::error::tarball contains ${pnpm_symlinks} .pnpm/ references (must be 0)"
            exit 1
          fi

      - name: Upload deploy bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-bundle
          path: deploy-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14
