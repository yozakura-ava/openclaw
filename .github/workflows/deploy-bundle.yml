name: Deploy Bundle

# Fresh minimal rewrite (2026-10-30, issue #300 phase 2b): the 2026-09-29-era
# deploy-bundle.yml depended on scripts/ci/prepare-deploy-dependencies.mts and
# scripts/ci/import-closure-gate.mts, which no longer exist on this fork's main
# (lost across base promotions). This rebuilds the documented sequence —
# install → build → pack → checksums → artifact — without the stale gates.
# The canonical-deploy-tarball skill locates runs by the exact name
# "Deploy Bundle"; keep this `name:` and the filename stable.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch / SHA to build. Defaults to workflow ref."
        required: false
        type: string
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_deploy_bundle:
    name: Build deploy bundle (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Enable corepack (pinned pnpm)
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-deploy-bundle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-deploy-bundle-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build mermaid renderer deps first
        run: pnpm --filter '@openclaw/mermaid-renderer...' build

      - name: Build workspace and runtime assets
        run: pnpm build

      - name: Record resolved source and provenance
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-bundle/provenance"
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          export SOURCE_SHA
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const hash = (path) => crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
          const provenance = {
            source_ref: process.env.SOURCE_REF,
            source_sha: process.env.SOURCE_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            built_at_utc: new Date().toISOString(),
            node_version: process.version,
            package_manager: JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager,
            manifest_sha256: hash("package.json"),
            lockfile_sha256: hash("pnpm-lock.yaml"),
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/deploy-bundle/provenance/provenance.json`, JSON.stringify(provenance, null, 2) + "\n");
          JS

      - name: Verify required runtime assets
        run: |
          for template in AGENTS SOUL IDENTITY USER BOOTSTRAP; do
            test -s "docs/reference/templates/$template.md"
          done
          test -s dist/build-info.json
          test -s dist/control-ui/index.html
          test -s dist/extensions/workboard/openclaw.plugin.json
          test -s dist/entry.js
          test -s dist/infra/sqlite-readonly-location.worker.js
          test -s dist/state/openclaw-state-read.worker.js
          test -d skills
          test -d node_modules/.pnpm

      - name: Pack deploy bundle tarball outside source tree
        run: |
          tar -czf "$RUNNER_TEMP/deploy-bundle/deploy-bundle.tar.gz" \
            --exclude=./node_modules/.cache \
            --exclude=./.git \
            .

      - name: Checksums and archive integrity
        run: |
          cd "$RUNNER_TEMP/deploy-bundle"
          sha256sum deploy-bundle.tar.gz provenance/provenance.json > deploy-bundle-checksums.txt
          sha256sum --check deploy-bundle-checksums.txt
          tar -tzf deploy-bundle.tar.gz > "$RUNNER_TEMP/deploy-bundle-contents.txt"
          test -s deploy-bundle.tar.gz
          if grep -Eq '^\./(deploy-bundle\.tar\.gz|\.git)(/|$)' "$RUNNER_TEMP/deploy-bundle-contents.txt"; then
            echo "Archive includes excluded build output or Git data" >&2
            exit 1
          fi

      - name: Upload deploy bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deploy-bundle-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/deploy-bundle/deploy-bundle.tar.gz
            ${{ runner.temp }}/deploy-bundle/provenance/provenance.json
            ${{ runner.temp }}/deploy-bundle/deploy-bundle-checksums.txt
          if-no-files-found: error
          compression-level: 0
