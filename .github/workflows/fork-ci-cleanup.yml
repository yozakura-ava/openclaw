name: Fork CI cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report cancellable runs without changing them.
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cancel stale fork CI runs
    runs-on: ubuntu-24.04
    steps:
      - name: Audit and cancel stale runs
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = process.env.DRY_RUN !== "false";
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
              event: "push",
            });
            const prRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
              event: "pull_request",
            });
            const all = [...runs, ...prRuns]
              .filter((run, index, list) => list.findIndex((candidate) => candidate.id === run.id) === index)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const active = new Set(["queued", "in_progress", "waiting", "requested", "pending"]);
            const deploy = (run) => run.name === "Deploy Bundle";
            const mainCi = (run) => run.name === "CI" && run.event === "push" && run.head_branch === "main";
            const newestMainCi = all.find(mainCi)?.id;
            const candidates = all.filter((run) => {
              if (!active.has(run.status) || deploy(run)) return false;
              if (mainCi(run)) return run.id !== newestMainCi;
              return run.event === "pull_request" || run.event === "push";
            });
            const summary = {
              dry_run: dryRun,
              scanned: all.length,
              preserved_deploy_bundle: all.filter(deploy).map((run) => run.id),
              preserved_newest_main_ci: newestMainCi ?? null,
              cancellable: candidates.map((run) => ({ id: run.id, name: run.name, event: run.event, branch: run.head_branch })),
            };
            core.summary
              .addHeading("Fork CI cleanup audit")
              .addCodeBlock(JSON.stringify(summary, null, 2), "json")
              .addRaw(dryRun ? "Dry run: no runs were cancelled." : "Cancellation requested for listed runs.")
              .write();
            if (!dryRun) {
              for (const run of candidates) {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              }
            }
