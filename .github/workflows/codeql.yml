name: CodeQL

on:
  workflow_dispatch:
    inputs:
      profile:
        description: CodeQL security profile to run
        required: false
        default: all
        type: choice
        options:
          - all
          - security
  pull_request:
    # Admission is label-based so adding ci/full retriggers the complete
    # matrix even when the PR itself does not touch a former CodeQL path.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

jobs:
  scope:
    name: Select CodeQL security scope
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should-scan: ${{ steps.detect.outputs.should-scan }}
    steps:
      - name: Detect CodeQL security paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci/full') && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          should_scan=false
          if [[ "${EVENT_NAME}" != "pull_request" || "${FULL_LABEL:-false}" == "true" ]]; then
            should_scan=true
          else
            # Keep security admission path-sensitive for ordinary PRs while
            # retaining the label as an explicit full-matrix expansion.
            changed_files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
            while IFS= read -r file; do
              case "${file}" in
                .github/actions/*|.github/codeql/*|.github/workflows/*|\
                extensions/acpx/src/*|extensions/bonjour/src/advertiser.ts|\
                extensions/browser/src/browser/chrome-mcp.ts|\
                extensions/browser/src/browser/chrome.executables.ts|\
                extensions/browser/src/browser/chrome.ts|\
                extensions/codex/src/app-server/sandbox-exec-server/*|\
                extensions/codex/src/app-server/transport-stdio.ts|\
                extensions/codex/src/node-cli-sessions.ts|\
                extensions/file-transfer/src/*|extensions/google-meet/src/*|\
                extensions/imessage/src/*|extensions/memory-wiki/src/obsidian.ts|\
                extensions/microsoft-foundry/cli.ts|\
                extensions/ollama/src/wsl2-crash-loop-check.ts|\
                extensions/qa-lab/src/*|extensions/signal/src/daemon.ts|\
                extensions/tts-local-cli/speech-provider.ts|\
                extensions/voice-call/src/*|packages/*|scripts/*|src/*|src/**/*)
                  should_scan=true
                  break
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          echo "should-scan=${should_scan}" >> "${GITHUB_OUTPUT}"

  security-high:
    name: Security High (${{ matrix.category }})
    needs: scope
    if: ${{ needs.scope.outputs.should-scan == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || inputs.profile == 'all' || inputs.profile == 'security') }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            category: core-auth-secrets
            runs_on: ubuntu-24.04
            timeout_minutes: 25
            config_file: ./.github/codeql/codeql-core-auth-secrets-critical-security.yml
          - language: javascript-typescript
            category: channel-runtime-boundary
            runs_on: ubuntu-24.04
            timeout_minutes: 25
            config_file: ./.github/codeql/codeql-channel-runtime-boundary-critical-security.yml
          - language: javascript-typescript
            category: network-ssrf-boundary
            runs_on: ubuntu-24.04
            timeout_minutes: 25
            config_file: ./.github/codeql/codeql-network-ssrf-boundary-critical-security.yml
          - language: javascript-typescript
            category: mcp-process-tool-boundary
            runs_on: ubuntu-24.04
            timeout_minutes: 25
            config_file: ./.github/codeql/codeql-mcp-process-tool-boundary-critical-security.yml
          - language: javascript-typescript
            category: process-exec-boundary
            runs_on: ubuntu-24.04
            timeout_minutes: 25
            config_file: ./.github/codeql/codeql-process-exec-boundary-critical-security.yml
          - language: javascript-typescript
            category: plugin-trust-boundary
            runs_on: ubuntu-24.04
            timeout_minutes: 25
            config_file: ./.github/codeql/codeql-plugin-trust-boundary-critical-security.yml
          - language: actions
            category: actions
            runs_on: ubuntu-24.04
            timeout_minutes: 10
            config_file: ./.github/codeql/codeql-actions-critical-security.yml
    steps:
      - name: Checkout
        if: ${{ matrix.category != 'actions' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Checkout Actions security sources
        if: ${{ matrix.category == 'actions' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          sparse-checkout: |
            .github/actions
            .github/workflows
            .github/codeql

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          config-file: ${{ matrix.config_file }}

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/codeql-security-high/${{ matrix.category }}"
